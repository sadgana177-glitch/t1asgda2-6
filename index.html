function normPw(s){return toLatin(s).trim().toLowerCase();}
async function sha(pw){
  var raw='mr9|'+normPw(pw);
  try{
    if(window.crypto&&crypto.subtle){
      var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
      return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');
    }
  }catch(e){}
  var h=5381;for(var i=0;i<raw.length;i++)h=((h<<5)+h+raw.charCodeAt(i))|0;return 'f'+h;
}

function parseVal(s){
  s=toLatin(s).replace(/[−–—]/g,'-').replace(/٫/g,'.').replace(/[\s،,]/g,'');
  if(!s)return NaN;
  if(s.indexOf('/')>-1){var pr=s.split('/');if(pr.length!==2)return NaN;var a=parseFloat(pr[0]),b=parseFloat(pr[1]);return(isNaN(a)||isNaN(b)||b===0)?NaN:a/b;}
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;
}
function checkPr(){
  var p=S.pr,got=p.labels.map(function(_,i){var el=document.getElementById('pin'+i);return parseVal(el?el.value:'');});
  var fb=$('#pr-fb');
  if(got.some(isNaN)){fb.className='fb no';fb.textContent='اكتب كل الإجابات أولًا. يمكنك كتابة الكسر هكذا: '+H('7/2')+'.';return;}
  var want=p.values.map(fval),ok;
  if(p.ordered){ok=got.every(function(g,i){return Math.abs(g-want[i])<1e-6;});}
  else{var used=[];ok=got.every(function(g){var j=want.findIndex(function(w,idx){return used.indexOf(idx)<0&&Math.abs(w-g)<1e-6;});if(j<0)return false;used.push(j);return true;});}
  fb.className='fb '+(ok?'ok':'no');
  fb.textContent=ok?'أحسنت! إجابتك صحيحة.':'ليست صحيحة بعد. راجع خطوات المثال المحلول وحاول مرة أخرى.';
}
function showPr(){

  ol.innerHTML=p.steps.map(function(s,i){return stepHtml(s,i,i===p.steps.length-1);}).join('');
}

function newPr(){S.pr=SECS[S.sec-1].gen(false);drawPr();}

/* ---------- quiz ---------- */
function mkQuestion(p){
  var key=function(vs){var a=p.ordered?vs:vs.slice().sort(function(x,y){return fval(x)-fval(y);});return JSON.stringify(a.map(function(f){return [f.n,f.d];}));};
  var seen={};seen[key(p.values)]=1;
  var opts=[{vs:p.values,ok:true}];
  var cands=shuffle((p.extra||[]).concat(p.cands?p.cands(p.values):defaultCands(p.values)));
  cands.forEach(function(vs){
    if(opts.length>=4)return;if(p.valid&&!p.valid(vs))return;
    var k=key(vs);if(seen[k])return;seen[k]=1;opts.push({vs:vs,ok:false});
  });
  var g=0;
  while(opts.length<4&&g++<80){
    var vs=p.values.map(function(f){return fadd(f,pick([-3,-2,-1,1,2,3]));});
    if(p.valid&&!p.valid(vs))continue;var k=key(vs);if(seen[k])continue;seen[k]=1;opts.push({vs:vs,ok:false});
  }
  opts=shuffle(opts);
  return {p:p,opts:opts,correct:opts.findIndex(function(o){return o.ok;})};
}
function buildQuiz(){
  var makers=[
    function(){return genZero('easy');},function(){return genZero('mixed');},
    genFactor,genFactor,genDiff,genDiff,
    function(){return genTri(false);},function(){return genTri(true);},
    genSquare,genSquare,
    function(){return genWord(pick(['num1','num2','num3']));},
    function(){return genWord(pick(['rect','tri','peri','cons']));}
  ];
  var qs=[],stems={};
  makers.forEach(function(mk){var p,t=0;do{p=mk();t++;}while(stems[p.stem]&&t<20);stems[p.stem]=1;qs.push(mkQuestion(p));});
  return qs;
}

function buildDoc(cfg){
  var hs=document.head.getElementsByTagName('style')[0],reset=hs?hs.textContent:'';
  var vm=document.head.querySelector('meta[name="viewport"]'),vp=vm?vm.getAttribute('content'):'width=device-width,initial-scale=1,viewport-fit=cover';
  var css=document.getElementById('css').textContent,js=document.getElementById('main').textContent;
  var cj=JSON.stringify(cfg).replace(/</g,'\\u003c'),CL='<'+'/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="'+vp+'"><style>'+reset+'</style></head><body>'+
    '<title>'+document.title+'</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="'+FONT_URL+'">'+
    '<style id="css">'+css+'</style><div id="app"></div><script type="application/json" id="cfg">'+cj+CL+'<script id="main">'+js+CL+'</body></html>';
}
async function savePw(){
  var a=$('#np1').value,b=$('#np2').value,err=$('#perr');
  err.className='err';
  if(normPw(a).length<4){err.textContent='كلمة السر يجب ألا تقل عن '+H(4)+' أحرف أو أرقام.';return;}
  if(a!==b){err.textContent='الكلمتان غير متطابقتين.';return;}
  var h=await sha(a),art=null;
  try{art=window.claude?await window.claude.use('artifact'):null;}catch(e){art=null;}
  if(!art){err.textContent='تغيير كلمة السر غير متاح هنا. افتح الصفحة من حساب صاحب الصفحة (المعلمة) ثم أعد المحاولة.';return;}
  $('#pw-save').disabled=true;err.textContent='جارٍ الحفظ...';
  try{
    await art.publish(buildDoc({h:h}));
    setUnlocked(h);err.className='err good';err.textContent='تم الحفظ. الكلمة الجديدة سارية الآن.';
  }catch(e){
    $('#pw-save').disabled=false;
    var c=e&&e.code;
    err.textContent=(c==='not_writer'||c==='not_granted')?'تغيير كلمة السر متاح لصاحب الصفحة فقط.':c==='conflict'?'تم تحديث الصفحة من مكان آخر. أعد المحاولة.':'تعذر الحفظ. حاول مرة أخرى.';
  }
}

/* ---------- navigation & render ---------- */
function render(){
  var html;
  if(S.view==='explain')html=explainView();
  else if(S.view==='quiz')html=quizView();
  else html=homeView();
  app.innerHTML=html+modalHtml();
  if(S.view==='explain'){
    if(!S.ex){S.ex=SECS[S.sec-1].gen(true);S.shown=1;}
    if(!S.pr)S.pr=SECS[S.sec-1].gen(false);
    drawEx();drawPr();
  }
  var f=$('#gpw')||$('#np1')||$('#stname');if(f&&(S.gate||S.settings||S.view==='quiz'))try{f.focus({preventScroll:true});}catch(e){}
}
function go(v){
  if((v==='explain'||v==='quiz')&&!unlocked()){S.gate=v;render();return;}
  S.gate=null;S.settings=false;S.view=v;
  if(v==='explain'){S.ex=null;S.pr=null;}
  if(v==='quiz'){S.q={stage:'name',name:'',qs:null,ans:[],i:0};}
  try{if(location.hash!=='#'+v)location.hash=v==='home'?'':v;}catch(e){}
  render();window.scrollTo(0,0);
}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'),v=t.getAttribute('data-v');
  if(act==='go')go(v);
  else if(act==='sec'){S.sec=+v;S.ex=null;S.pr=null;render();}
  else if(act==='next-step'){S.shown=Math.min(S.shown+1,S.ex.steps.length);drawEx();}
  else if(act==='all-steps'){S.shown=S.ex.steps.length;drawEx();}
  else if(act==='new-ex')newEx(false);
  else if(act==='new-pr')newPr();
  else if(act==='check-pr')checkPr();
  else if(act==='show-pr')showPr();
  else if(act==='open-pw'){S.settings=true;S.gate=null;render();}
  else if(act==='close-modal'){S.gate=null;S.settings=false;render();}
  else if(act==='q-edit'){S.q.stage='name';render();}
  else if(act==='q-start'){S.q.qs=buildQuiz();S.q.ans=[];S.q.i=0;S.q.stage='run';render();window.scrollTo(0,0);}
  else if(act==='pick'){S.q.ans[S.q.i]=+v;render();}
  else if(act==='q-prev'){if(S.q.i>0){S.q.i--;render();}}
  else if(act==='q-next'){if(S.q.i<S.q.qs.length-1){S.q.i++;}else{S.q.stage='done';}render();window.scrollTo(0,0);}
  else if(act==='q-again'){S.q={stage:'confirm',name:S.q.name,qs:null,ans:[],i:0};render();window.scrollTo(0,0);}
  else if(act==='q-copy'){
    var txt=resultText(),fb=$('#copy-fb');
    var done=function(ok){fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'تم نسخ النتيجة. الصقها في رسالة للمعلمة.':'تعذر النسخ تلقائيًا. انسخ النتيجة من الشاشة يدويًا.';};
    try{navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});}catch(err){done(false);}
  }
});
app.addEventListener('submit',async function(e){
  e.preventDefault();
  if(e.target.id==='gate-form'){
    var pw=$('#gpw').value,h=await sha(pw);
    if(h===CFG.h){setUnlocked(h);var target=S.gate;S.gate=null;go(target);}
    else{$('#gerr').textContent='كلمة السر غير صحيحة. حاول مرة أخرى.';$('#gpw').select();}
  }else if(e.target.id==='pw-form'){savePw();}
  else if(e.target.id==='name-form'){
    var nm=$('#stname').value.trim();if(nm.length<2)return;
    S.q.name=nm;S.q.stage='confirm';render();
  }
});
app.addEventListener('input',function(e){
  if(e.target.id==='stname'){var b=$('#name-next');if(b)b.disabled=e.target.value.trim().length<2;S.q.name=e.target.value;}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(S.gate||S.settings)){S.gate=null;S.settings=false;render();}});
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(h==='explain'||h==='quiz'){if(S.view!==h)go(h);}else if(S.view!=='home'&&h===''){S.view='home';S.gate=null;render();}
});

/* ---------- test hook (no effect for viewers) ---------- */
if(window.__MR9_TEST__){window.__MR9__={genZero:genZero,genFactor:genFactor,genDiff:genDiff,genTri:genTri,genSquare:genSquare,genWord:genWord,mkQuestion:mkQuestion,buildQuiz:buildQuiz,WORD_KINDS:WORD_KINDS,fval:fval};}
else{
  var h0=(location.hash||'').replace('#','');
  if(h0==='explain'||h0==='quiz')go(h0);else render();
}
})();
</script>
